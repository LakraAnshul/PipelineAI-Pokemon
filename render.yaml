# Render Blueprint — a static site, not a server.
#
# The rewrite is the load-bearing line: `dist/` contains exactly one HTML file,
# so without it a deep link like /pokemon/pikachu asks Render for a file that
# does not exist and gets a 404 instead of Pikachu.
services:
  - type: web
    name: pokemon-explorer
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hashed filenames are immutable; index.html must never be cached, or a
      # returning visitor keeps loading the previous build's asset names.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
